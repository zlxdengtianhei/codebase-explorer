[project]
name = "codebase-explorer"
version = "1.0.0"
description = "MCP Server + Agent Skill for codebase exploration and documentation generation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "graph-sitter>=0.2.0",
    "jinja2>=3.1.0",
    "mcp>=1.0.0",
    "networkx>=3.0",
    "python-louvain>=0.16",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
]
