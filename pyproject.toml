[project]
name = "codebase-explorer"
version = "2.0.0"
description = "Source-grounded, navigable documentation for software repositories"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "markdown-it-py>=4.0,<5",
    "networkx>=3.3",
    "orjson>=3.10,<4",
    "pydantic>=2.9",
    "tiktoken>=0.9,<1",
    "tree-sitter>=0.23.2",
    "tree-sitter-javascript>=0.23.1",
    "tree-sitter-typescript>=0.23.2",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.0",
]

[project.scripts]
cbe = "cbe.cli:main"
cbe-mcp = "cbe.mcp_server:main"
cbe-install = "cbe_install.cli:main"
cbe-http = "cbe_install.http_adapter:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbe", "src/cbe_install"]

[tool.hatch.build.targets.wheel.force-include]
".dsh/skills/codebase-explorer" = "cbe_install/resources/codebase-explorer"

[tool.hatch.build.targets.sdist]
only-include = ["src/cbe", "src/cbe_install", ".dsh/skills/codebase-explorer", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "failpoint: exercises environment-variable failpoints via subprocess",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
