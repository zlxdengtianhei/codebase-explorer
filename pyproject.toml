[project]
name = "codebase-explorer"
version = "2.2.0.dev0"
description = "Source-grounded, navigable documentation for software repositories"
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "zlxdengtianhei" }]
keywords = ["code-documentation", "code-understanding", "call-graph", "agent-skills", "claude-code", "tree-sitter", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tiktoken>=0.9,<1",
    "networkx>=3.2",
    "tree-sitter==0.26.0",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-go==0.25.0",
]

[project.optional-dependencies]
graphs = ["grimp==3.17"]
languages = [
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-php==0.25.1",
    "tree-sitter-c-sharp==0.23.5",
]
languages-community = [
    "tree-sitter-kotlin==1.1.0",
    "tree-sitter-swift==0.7.4",
]

[project.urls]
Homepage = "https://github.com/zlxdengtianhei/codebase-explorer"
Documentation = "https://github.com/zlxdengtianhei/codebase-explorer/blob/main/docs/running.md"
"Online example" = "https://zlxdengtianhei.github.io/codebase-explorer/?data=flask"
Changelog = "https://github.com/zlxdengtianhei/codebase-explorer/blob/main/CHANGELOG.md"
Issues = "https://github.com/zlxdengtianhei/codebase-explorer/issues"

[project.scripts]
cbe = "cbe.cli:main"
cbe-install = "cbe_install.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

# The README on PyPI is README.md with its repository-relative links and images made absolute
# and pinned to the release tag, so they work outside GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(((?:docs|examples|evaluation)/[^)]*|LICENSE|CHANGELOG\.md)\)'
replacement = '](https://github.com/zlxdengtianhei/codebase-explorer/blob/v$HFPR_VERSION/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(README\.zh-CN\.md|LICENSE|pyproject\.toml)"'
replacement = 'href="https://github.com/zlxdengtianhei/codebase-explorer/blob/v$HFPR_VERSION/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(docs/media/[^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/zlxdengtianhei/codebase-explorer/v$HFPR_VERSION/\1"'

[tool.hatch.build.targets.wheel]
packages = ["src/cbe", "src/cbe_install"]

[tool.hatch.build.targets.wheel.force-include]
"plugin/skills/codebase-explorer" = "cbe_install/resources/codebase-explorer"
"plugin/agents" = "cbe_install/resources/agents"

[tool.hatch.build.targets.sdist]
only-include = ["src/cbe", "src/cbe_install", "plugin/skills/codebase-explorer", "plugin/agents", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Several test modules import shared helpers from sibling test modules. Put
# tests/ on sys.path so this also works with --import-mode=importlib (CI).
pythonpath = ["tests"]
markers = [
    "failpoint: exercises environment-variable failpoints via subprocess",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
