[project]
name = "codebase-explorer"
version = "0.1.0"
description = "MCP Server + Agent Skill for codebase exploration and documentation generation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "graph-sitter>=0.2.0",
    "jinja2>=3.1.0",
    "mcp>=1.0.0",
    "networkx>=3.0",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["setuptools>=61.0"]
