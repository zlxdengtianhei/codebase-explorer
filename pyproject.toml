[project]
name = "codebase-explorer"
version = "2.1.0"
description = "Source-grounded, navigable documentation for software repositories"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tiktoken>=0.9,<1",
    "tree-sitter>=0.23.2",
    "tree-sitter-javascript>=0.23.1",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
cbe = "cbe.cli:main"
cbe-install = "cbe_install.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbe", "src/cbe_install"]

[tool.hatch.build.targets.wheel.force-include]
".dsh/skills/codebase-explorer" = "cbe_install/resources/codebase-explorer"

[tool.hatch.build.targets.sdist]
only-include = ["src/cbe", "src/cbe_install", ".dsh/skills/codebase-explorer", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Several test modules import shared helpers from sibling test modules. Put
# tests/ on sys.path so this also works with --import-mode=importlib (CI).
pythonpath = ["tests"]
markers = [
    "failpoint: exercises environment-variable failpoints via subprocess",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
