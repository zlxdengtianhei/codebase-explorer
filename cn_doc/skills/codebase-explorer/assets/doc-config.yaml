# codebase-explorer 默认配置
output_dir: .codebase-docs # 文档输出目录
max_depth: 5 # 最大文档层级深度
languages:
  - python
  - typescript
  - javascript
budget:
  total_tokens: 50000 # 总 Token 预算
  max_per_module: 10000 # 每个模块最大 Token 数
depth:
  min_lines_for_split: 200 # 触发拆分的最小代码行数
  min_components_for_split: 15 # 触发拆分的最小组件数
  decay_factor: 0.6 # 每层预算的衰减系数
templates:
  dir: src/templates # 模板文件目录
