name: Wheel installation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Build source distribution and wheel
        run: uv build --sdist --wheel --out-dir "$RUNNER_TEMP/dist"
      - name: Install wheel in a clean environment
        run: |
          uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP"/dist/*.whl pytest
      - name: Test source checkout behavior and resources
        run: |
          cd "$RUNNER_TEMP"
          PYTHONPATH="$GITHUB_WORKSPACE/src" "$RUNNER_TEMP/venv/bin/python" -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib --basetemp="$RUNNER_TEMP/source-tests" -q
      - name: Check public wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          from zipfile import ZipFile
          wheel = next((Path(__import__("os").environ["RUNNER_TEMP"]) / "dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
              assert all(name.startswith(("cbe/", "cbe_install/", "codebase_explorer-")) for name in names), names
              assert any("LICENSE" in name for name in names)
              assert not any("__pycache__" in name for name in names)
              assert not any(b"/Users/" in archive.read(name) or b"/home/" in archive.read(name) for name in names if not name.endswith("/"))
          sdist = next((Path(__import__("os").environ["RUNNER_TEMP"]) / "dist").glob("*.tar.gz"))
          with tarfile.open(sdist) as archive:
              for member in archive:
                  if not member.isfile():
                      continue
                  relative = "/".join(member.name.split("/")[1:])
                  assert relative in ("README.md", "LICENSE", "pyproject.toml", "PKG-INFO", ".gitignore") or relative.startswith(("src/cbe/", "src/cbe_install/", ".dsh/skills/codebase-explorer/")), relative
                  payload = archive.extractfile(member).read()
                  assert b"/Users/" not in payload and b"/home/" not in payload, relative
          PY
      - name: Test installed wheel outside checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -m pytest "$GITHUB_WORKSPACE/tests/test_installation.py" --import-mode=importlib -q
          "$RUNNER_TEMP/venv/bin/cbe" --help
          "$RUNNER_TEMP/venv/bin/cbe-http" --help
          "$RUNNER_TEMP/venv/bin/cbe-install" install --dir "$RUNNER_TEMP/skills with spaces"
          "$RUNNER_TEMP/venv/bin/cbe-install" doctor --dir "$RUNNER_TEMP/skills with spaces"
