name: Publish to PyPI
# Runs when a version tag (v2.2.0) is pushed. Builds once, checks the build, then publishes
# with PyPI Trusted Publishing (OpenID Connect): no API token is stored in this repository.
# One-time setup on pypi.org: add a trusted publisher for this repository with
# workflow "publish.yml" and environment "pypi".
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: The tag must be the version in pyproject.toml
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          case "$version" in *dev*) echo "refusing to publish a development version: $version"; exit 1;; esac
      - name: Build the source distribution and the wheel
        run: uv build --sdist --wheel --out-dir dist
      - name: Check the metadata and the long description
        run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean environment and run it
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/cbe" --version
          "$RUNNER_TEMP/venv/bin/cbe" languages > /dev/null
          mkdir project
          "$RUNNER_TEMP/venv/bin/cbe-install" install --host claude-code --scope project --project project
          "$RUNNER_TEMP/venv/bin/cbe-install" doctor --host claude-code --scope project --project project
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/codebase-explorer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
